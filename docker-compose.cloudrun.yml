services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      DOPPLER_TOKEN: ${DOPPLER_TOKEN:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
