<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Item Valuation - Reseller Helper</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; color: white; margin-bottom: 24px; }
        header h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        header p { font-size: 1.1em; opacity: 0.9; }
        .auth-bar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; background: rgba(255,255,255,0.16); padding: 10px 16px; border-radius: 10px; margin-bottom: 20px; color: white; font-size: 0.9em; }
        .auth-bar input { padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.4); background: white; color: #333; width: 220px; }
        .auth-bar button { width: auto; margin-top: 0; padding: 6px 14px; font-size: 0.85em; background: #28a745; }
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px; }
        .card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 24px; }
        .card h2 { margin-bottom: 20px; color: #333; border-bottom: 2px solid #667eea; padding-bottom: 10px; }
        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }
        .upload-area:hover { border-color: #764ba2; background: #f0f2ff; }
        .upload-area.dragover { border-color: #764ba2; background: #e8e5ff; }
        .upload-area p { color: #666; margin-bottom: 10px; }
        .upload-area .icon { font-size: 3em; margin-bottom: 10px; }
        #imageInput { display: none; }
        .preview-img { max-width: 100%; max-height: 300px; border-radius: 8px; margin: 20px 0; display: none; }
        .preview-img.show { display: block; }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background 0.2s;
        }
        button:hover { background: #5a6fd6; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .results { display: none; }
        .results.show { display: block; }
        .item-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            background: #fafafa;
        }
        .item-card h3 { color: #333; margin-bottom: 8px; }
        .item-card .price { font-size: 1.4em; color: #28a745; font-weight: bold; }
        .item-card .meta { color: #666; font-size: 0.9em; margin-top: 6px; }
        .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .history-item {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 14px;
            background: #fafafa;
        }
        .history-item h4 { margin-bottom: 6px; color: #333; }
        .history-item .price { color: #28a745; font-weight: bold; }
        .history-item .meta { font-size: 0.85em; color: #666; margin-top: 4px; }
        .stats-row { display: flex; gap: 20px; justify-content: space-around; text-align: center; }
        .stat-box { flex: 1; }
        .stat-box .num { font-size: 1.8em; font-weight: bold; color: #667eea; }
        .stat-box .label { font-size: 0.85em; color: #666; }
        .error-msg {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            display: none;
        }
        .error-msg.show { display: block; }
        .spinner { display: none; text-align: center; padding: 20px; }
        .spinner.show { display: block; }
        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Item Valuation</h1>
            <p>Upload a photo &rarr; detect items &rarr; get market value estimates</p>
        </header>

        <div class="auth-bar">
            <label for="apiKeyInput">API Key:</label>
            <input type="password" id="apiKeyInput" placeholder="Bearer token / API key" />
            <button onclick="saveApiKey()">Save</button>
        </div>

        <div class="main-grid">
            <div class="card">
                <h2>Upload Photo</h2>
                <div class="upload-area" id="uploadArea" tabindex="0" role="button" aria-label="Upload image">
                    <div class="icon">📷</div>
                    <p>Drag & drop or click to upload</p>
                    <p style="font-size: 0.85em; color: #999;">JPG, PNG up to 16 MB</p>
                </div>
                <input type="file" id="imageInput" accept="image/*" />
                <img id="preview" class="preview-img" alt="Preview" />
                <button id="analyzeBtn" disabled>Analyze Image</button>
                <div class="spinner" id="spinner">Analyzing…</div>
                <div class="error-msg" id="errorMsg"></div>
            </div>

            <div class="card results" id="resultsCard">
                <h2>Results</h2>
                <div id="resultsList"></div>
            </div>
        </div>

        <div class="card">
            <h2>Stats</h2>
            <div class="stats-row">
                <div class="stat-box">
                    <div class="num" id="statTotal">0</div>
                    <div class="label">Total Valuations</div>
                </div>
                <div class="stat-box">
                    <div class="num" id="statAvgValue">$0.00</div>
                    <div class="label">Avg Value</div>
                </div>
                <div class="stat-box">
                    <div class="num" id="statAvgCondition">0%</div>
                    <div class="label">Worth Listing Rate</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Recent History</h2>
            <div class="history-grid" id="historyGrid">
                <p style="color: #999;">No valuations yet.</p>
            </div>
        </div>
    </div>

    <script>
        function escapeHTML(str) {
            if (str === null || str === undefined) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function getApiKey() {
            return localStorage.getItem("ai_list_assist_api_key") || "";
        }

        function saveApiKey() {
            const key = document.getElementById("apiKeyInput").value.trim();
            localStorage.setItem("ai_list_assist_api_key", key);
        }

        function apiHeaders(extra) {
            const h = Object.assign({}, extra || {});
            const key = getApiKey();
            if (key) h["Authorization"] = "Bearer " + key;
            return h;
        }

        const uploadArea = document.getElementById("uploadArea");
        const imageInput = document.getElementById("imageInput");
        const preview = document.getElementById("preview");
        const analyzeBtn = document.getElementById("analyzeBtn");
        const spinner = document.getElementById("spinner");
        const errorMsg = document.getElementById("errorMsg");
        const resultsCard = document.getElementById("resultsCard");
        const resultsList = document.getElementById("resultsList");

        let selectedFile = null;

        uploadArea.addEventListener("click", () => imageInput.click());
        uploadArea.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); imageInput.click(); }
        });

        uploadArea.addEventListener("dragover", (e) => {
            e.preventDefault();
            uploadArea.classList.add("dragover");
        });
        uploadArea.addEventListener("dragleave", () => uploadArea.classList.remove("dragover"));
        uploadArea.addEventListener("drop", (e) => {
            e.preventDefault();
            uploadArea.classList.remove("dragover");
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });

        imageInput.addEventListener("change", () => {
            if (imageInput.files.length) handleFile(imageInput.files[0]);
        });

        function handleFile(file) {
            if (!file.type.startsWith("image/")) {
                showError("Please select an image file.");
                return;
            }
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.classList.add("show");
                analyzeBtn.disabled = false;
            };
            reader.readAsDataURL(file);
            hideError();
        }

        analyzeBtn.addEventListener("click", async () => {
            if (!selectedFile) return;
            analyzeBtn.disabled = true;
            spinner.classList.add("show");
            hideError();
            resultsCard.classList.remove("show");

            const formData = new FormData();
            formData.append("image", selectedFile);

            try {
                const response = await fetch("/api/analyze", {
                    method: "POST",
                    headers: apiHeaders(),
                    body: formData,
                });
                const data = await response.json();

                if (!response.ok || !data.success) {
                    showError(data.error || "Analysis failed");
                    return;
                }

                const items = data.items || [];
                if (items.length === 0) {
                    resultsList.innerHTML = "<p>No items detected.</p>";
                } else {
                    resultsList.innerHTML = items.map(item => `
                        <div class="item-card">
                            <h3>${escapeHTML(item.item_name || "Item")}</h3>
                            <div class="price">$${Number(item.estimated_value || 0).toFixed(2)}</div>
                            <div class="meta">
                                ${item.worth_listing ? "✅ Worth listing" : "⚠️ Low value"}<br>
                                Profitability: ${escapeHTML((item.profitability || "").toUpperCase())}<br>
                                Status: ${escapeHTML(item.status || "")}
                            </div>
                        </div>
                    `).join("");
                }
                resultsCard.classList.add("show");
                loadHistory();
                loadStats();
            } catch (err) {
                showError("Network error: " + err.message);
            } finally {
                spinner.classList.remove("show");
                analyzeBtn.disabled = false;
            }
        });

        async function loadHistory() {
            try {
                const response = await fetch("/api/stats", { headers: apiHeaders() });
                // History endpoint may vary; use recent from a dedicated route if available
                const histResp = await fetch("/api/valuations/recent?limit=12", { headers: apiHeaders() }).catch(() => null);
                let items = [];
                if (histResp && histResp.ok) {
                    const data = await histResp.json();
                    items = data.valuations || data.items || [];
                }

                const grid = document.getElementById("historyGrid");
                if (items.length === 0) {
                    grid.innerHTML = '<p style="color: #999;">No valuations yet.</p>';
                    return;
                }

                grid.innerHTML = items.map(item => `
                    <div class="history-item">
                        <h4>${escapeHTML(item.item_name)}</h4>
                        <div class="price">$${Number(item.estimated_value || 0).toFixed(2)}</div>
                        <div class="meta">
                            Condition: ${item.condition_score || 7}/10<br>
                            ${escapeHTML((item.profitability || "").toUpperCase())}<br>
                            <small>${new Date(item.timestamp || item.upload_timestamp).toLocaleDateString()}</small>
                        </div>
                    </div>
                `).join("");
            } catch (err) {
                console.error("Error loading history:", err);
            }
        }

        async function loadStats() {
            try {
                const response = await fetch("/api/stats", { headers: apiHeaders() });
                const data = await response.json();
                const stats = data.stats || data;

                if (stats && stats.total_valuations !== undefined) {
                    document.getElementById("statTotal").textContent = stats.total_valuations;
                    document.getElementById("statAvgValue").textContent = "$" + Number(stats.average_value || 0).toFixed(2);
                    document.getElementById("statAvgCondition").textContent = Number(stats.approval_rate || 0).toFixed(1) + "%";
                }
            } catch (err) {
                console.error("Error loading stats:", err);
            }
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add("show");
        }

        function hideError() {
            errorMsg.classList.remove("show");
        }

        document.addEventListener("DOMContentLoaded", () => {
            const keyInput = document.getElementById("apiKeyInput");
            if (keyInput) keyInput.value = getApiKey();
            loadHistory();
            loadStats();
        });
    </script>
</body>
</html>
